<div id="manageFilesModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Manage Files</h3>
            <button id="closeManageFiles" class="close-modal-btn">&times;</button>
        </div>

            <div id="fileListContainer" class="file-list">

        <div class="modal-footer">

        </div>
